# =============================================================================
# Production Nginx Reverse Proxy & TLS Configuration
# E-Commerce Cloud DevOps Platform (React SPA + Express REST API)
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Security: Hide Nginx Version Signature
    # -------------------------------------------------------------------------
    server_tokens off;

    # -------------------------------------------------------------------------
    # Security: Sanitized Access Logging (Prevents Logging Sensitive Auth Headers)
    # -------------------------------------------------------------------------
    log_format sanitized_combined '$remote_addr - $remote_user [$time_local] '
                                  '"$request_method $request_uri $server_protocol" '
                                  '$status $body_bytes_sent '
                                  '"$http_referer" "$http_user_agent" '
                                  'rt=$request_time uct="$upstream_connect_time" '
                                  'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  sanitized_combined;

    # -------------------------------------------------------------------------
    # Performance & Optimization
    # -------------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    types_hash_max_size 2048;

    # -------------------------------------------------------------------------
    # Request Size Limits & Client Timeouts (Mitigates Slowloris & DoS)
    # -------------------------------------------------------------------------
    client_max_body_size        10M;
    client_body_buffer_size     128k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;

    client_body_timeout         15s;
    client_header_timeout       15s;
    keepalive_timeout           65s;
    send_timeout                15s;

    # -------------------------------------------------------------------------
    # Rate Limiting & Connection Throttling
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # -------------------------------------------------------------------------
    # Gzip Compression for Frontend Assets & JSON APIs
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Upstream Node.js Express Application
    # -------------------------------------------------------------------------
    upstream backend_app {
        server app:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # HTTP Server (Port 80)
    # - Serves React Admin Dashboard SPA at root (/)
    # - Reverse proxies /api/*, /health, /ready, /metrics to Express
    # - Serves ACME challenge for Let's Encrypt automated renewal
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /var/www/html;
        index index.html;

        # Let's Encrypt / Certbot Webroot ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Static Assets Caching (Vite immutable hashed bundles)
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Direct HTTP Health & Readiness Probes (Bypass Rate Limiting)
        # Supports /health, /health/ready, /ready, and /metrics
        location ~ ^/(health(/.*)?|ready|metrics)$ {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward API Routes to Express Application Container
        location ~ ^/api(/.*)?$ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_app;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;
        }

        # React Dashboard SPA Root & History Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS Server (Port 443) - Secure TLS Reverse Proxy & React Dashboard
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        root /var/www/html;
        index index.html;

        # ---------------------------------------------------------------------
        # SSL / TLS Certificate Configuration
        # ---------------------------------------------------------------------
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ---------------------------------------------------------------------
        # Security Headers
        # ---------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self';" always;

        limit_conn conn_limit 20;

        # Static Assets Caching (Vite immutable hashed bundles)
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Liveness, Readiness & Metrics Probes (Bypass Rate Limiting)
        # Supports /health, /health/ready, /ready, and /metrics
        location ~ ^/(health(/.*)?|ready|metrics)$ {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Forward API Routes to Express Application Container
        location ~ ^/api(/.*)?$ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_app;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;
        }

        # React Dashboard SPA Root & History Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
