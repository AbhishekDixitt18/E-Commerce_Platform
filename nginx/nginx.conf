# =============================================================================
# Production Nginx Reverse Proxy & TLS Configuration
# E-Commerce Cloud DevOps Platform
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Security: Hide Nginx Version Signature
    # -------------------------------------------------------------------------
    server_tokens off;

    # -------------------------------------------------------------------------
    # Security: Sanitized Access Logging (Prevents Logging Sensitive Auth Headers)
    # -------------------------------------------------------------------------
    log_format sanitized_combined '$remote_addr - $remote_user [$time_local] '
                                  '"$request_method $request_uri $server_protocol" '
                                  '$status $body_bytes_sent '
                                  '"$http_referer" "$http_user_agent" '
                                  'rt=$request_time uct="$upstream_connect_time" '
                                  'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  sanitized_combined;

    # -------------------------------------------------------------------------
    # Performance & Optimization
    # -------------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    types_hash_max_size 2048;

    # -------------------------------------------------------------------------
    # Request Size Limits & Client Timeouts (Mitigates Slowloris & DoS)
    # -------------------------------------------------------------------------
    client_max_body_size        10M;
    client_body_buffer_size     128k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;

    client_body_timeout         15s;
    client_header_timeout       15s;
    keepalive_timeout           65s;
    send_timeout                15s;

    # -------------------------------------------------------------------------
    # Rate Limiting & Connection Throttling
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # -------------------------------------------------------------------------
    # Gzip Compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss;

    # -------------------------------------------------------------------------
    # Upstream Node.js Express Application
    # -------------------------------------------------------------------------
    upstream backend_app {
        server app:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # HTTP Server (Port 80)
    # - Serves ACME challenge for Let's Encrypt automated renewal
    # - Serves /health for unencrypted load balancer / container health probes
    # - Redirects all other traffic to HTTPS (301 Permanent Redirect)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt / Certbot Webroot ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Direct HTTP Health Check (Used by AWS ALB / Local Probes)
        location = /health {
            proxy_pass http://backend_app/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect all other HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS Server (Port 443) - Secure TLS Reverse Proxy
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # ---------------------------------------------------------------------
        # SSL / TLS Certificate Configuration
        # Defaults to local self-signed cert; replaced by Let's Encrypt when domain exists
        # ---------------------------------------------------------------------
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # ---------------------------------------------------------------------
        # Secure TLS Protocols & Strong Cipher Suites (Mozilla Modern/Intermediate)
        # ---------------------------------------------------------------------
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

        # SSL Session Cache & Lifetime
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ---------------------------------------------------------------------
        # Security Headers
        # ---------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

        # Connection Limit per IP
        limit_conn conn_limit 20;

        # ---------------------------------------------------------------------
        # Liveness & Readiness Probes (Bypass Rate Limiting)
        # ---------------------------------------------------------------------
        location ~ ^/(health|ready)$ {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ---------------------------------------------------------------------
        # Main API & Application Routes
        # ---------------------------------------------------------------------
        location / {
            # Apply rate limiting: 10 req/sec with burst buffer of 20
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_app;
            proxy_http_version 1.1;

            # Proxy Headers for accurate client tracking & WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Proxy Buffering & Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;
        }
    }
}
