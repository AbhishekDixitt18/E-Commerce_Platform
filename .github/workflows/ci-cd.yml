name: CI/CD Pipeline - E-Commerce Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Minimal default permissions adhering to least privilege principle
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # STAGE 1: CHECKOUT
  # =============================================================================
  stage-1-checkout:
    name: 'Stage 1: Checkout'
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Git Repository & Commit Integrity
        run: |
          echo "=========================================="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Git Branch/Ref: ${{ github.ref }}"
          git log -1 --format="Author: %an <%ae>%nCommit: %H%nSubject: %s"
          echo "=========================================="

  # =============================================================================
  # STAGE 2: DEPENDENCIES
  # =============================================================================
  stage-2-dependencies:
    name: 'Stage 2: Dependencies'
    needs: stage-1-checkout
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Stage 2a - Install Backend Dependencies from Lockfile
        run: npm ci

      - name: Stage 2b - Install Frontend Dependencies from Lockfile
        run: |
          cd frontend
          npm ci

      - name: Verify Dependency Tree Integrity
        run: npm ls --depth=0

  # =============================================================================
  # STAGE 3: CODE QUALITY & FRONTEND BUILD
  # =============================================================================
  stage-3-code-quality:
    name: 'Stage 3: Code Quality & Frontend Build'
    needs: stage-2-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Backend & Frontend Dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Stage 3a - Run Backend Static Analysis (ESLint)
        run: npm run lint

      - name: Stage 3b - Build Frontend Production Bundle (Vite)
        run: |
          cd frontend
          npm run build

      - name: Stage 3c - Verify Frontend Build Artifacts
        run: |
          if [ ! -f "frontend/dist/index.html" ]; then
            echo "ERROR: frontend/dist/index.html was not generated!"
            exit 1
          fi
          echo "Frontend bundle verified successfully: index.html is present."
          ls -la frontend/dist

  # =============================================================================
  # STAGE 4: AUTOMATED TESTING
  # =============================================================================
  stage-4-automated-testing:
    name: 'Stage 4: Automated Testing'
    needs: stage-3-code-quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Initialize Isolated PostgreSQL Test Database
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce_test
          DB_USER: postgres
          DB_PASSWORD: postgres_ci_password
        run: |
          npm run db:init
          npm run db:seed

      - name: Stage 4 - Execute Automated Test Suite with Coverage
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce_test
          DB_USER: postgres
          DB_PASSWORD: postgres_ci_password
          ADMIN_API_KEY: algions-devops-admin-key-2026
        run: npm run test:coverage

  # =============================================================================
  # STAGE 5: DOCKER BUILD
  # =============================================================================
  stage-5-docker-build:
    name: 'Stage 5: Docker Build'
    needs: stage-4-automated-testing
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stage 5 - Build Application Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ecommerce-api:${{ github.sha }}
          cache-from: type=gha

      - name: Save Docker Image to Artifact Archive
        run: |
          mkdir -p /tmp/docker-build
          docker save ecommerce-api:${{ github.sha }} -o /tmp/docker-build/ecommerce-api.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-build/ecommerce-api.tar
          retention-days: 1

  # =============================================================================
  # STAGE 6: SECURITY SCANNING
  # =============================================================================
  stage-6-security-scanning:
    name: 'Stage 6: Security Scanning'
    needs: stage-5-docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-build

      - name: Load Docker Image into Runner Daemon
        run: |
          docker load -i /tmp/docker-build/ecommerce-api.tar

      - name: Stage 6 - Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ecommerce-api:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # =============================================================================
  # STAGE 7: IMAGE TAGGING
  # =============================================================================
  stage-7-image-tagging:
    name: 'Stage 7: Image Tagging'
    needs: stage-6-security-scanning
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Docker Hub Image Repository Name
        id: img_info
        run: |
          REPO_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$REPO_USER" ]; then
            REPO_USER="abhishekdixitt18"
          fi
          echo "image_name=${REPO_USER}/ecommerce-cloud-devops" >> $GITHUB_OUTPUT

      - name: Stage 7 - Generate Image Version Tags from Commit SHA
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img_info.outputs.image_name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch

      - name: Display & Store Generated Version Tags
        run: |
          echo "=========================================="
          echo "Generated Version Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "=========================================="
          mkdir -p /tmp/docker-meta
          echo "${{ steps.meta.outputs.tags }}" > /tmp/docker-meta/tags.txt

      - name: Upload Version Tags Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-tags
          path: /tmp/docker-meta/tags.txt
          retention-days: 1

  # =============================================================================
  # STAGE 8: IMAGE PUSH
  # =============================================================================
  stage-8-image-push:
    name: 'Stage 8: Image Push'
    needs: stage-7-image-tagging
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker Hub Credentials
        id: docker_secrets
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_TOKEN" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Docker Hub credentials are fully configured."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning ::Docker Hub secrets (DOCKERHUB_USERNAME and DOCKERHUB_TOKEN) are not configured. Image push stage skipped. All prior validation stages passed."
          fi

      - name: Download Docker Image Artifact
        if: github.event_name != 'pull_request' && steps.docker_secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-build

      - name: Download Version Tags Artifact
        if: github.event_name != 'pull_request' && steps.docker_secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: docker-tags
          path: /tmp/docker-meta

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.docker_secrets.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Stage 8 - Tag and Push Image to Docker Hub
        if: github.event_name != 'pull_request' && steps.docker_secrets.outputs.configured == 'true'
        run: |
          docker load -i /tmp/docker-build/ecommerce-api.tar
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Tagging image: $tag"
              docker tag ecommerce-api:${{ github.sha }} "$tag"
              echo "Pushing image to Docker Hub: $tag"
              docker push "$tag"
            fi
          done < /tmp/docker-meta/tags.txt

  # =============================================================================
  # STAGE 9: EC2 PRODUCTION DEPLOYMENT & AUTOMATED ROLLBACK
  # =============================================================================
  stage-9-ec2-deployment:
    name: 'Stage 9: EC2 Deployment & Rollback Safety'
    needs: [stage-7-image-tagging, stage-8-image-push]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: ec2-production-deployment
      cancel-in-progress: false
    steps:
      - name: Check EC2 Deployment Credentials
        id: ec2_secrets
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY || secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -n "$EC2_KEY" ] && [ -n "$EC2_HOST" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "EC2 SSH deployment credentials configured."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice ::EC2 SSH deployment secrets (EC2_SSH_PRIVATE_KEY / EC2_SSH_KEY, EC2_HOST) not configured in GitHub Secrets. Direct SSH deployment skipped; can be deployed via EC2 Instance Connect."
          fi

      - name: Deploy to AWS EC2 via SSH with Rollback Guard
        if: steps.ec2_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY || secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=========================================="
            echo "Starting Safe EC2 Continuous Deployment"
            echo "Commit SHA: ${{ github.sha }}"
            echo "=========================================="

            # Locate project directory
            REPO_DIR="$HOME/E-Commerce_Platform"
            [ -d "$REPO_DIR" ] || REPO_DIR="$HOME/ecommerce-cloud-devops"
            [ -d "$REPO_DIR" ] || REPO_DIR="$(find ~ -maxdepth 2 -name '.git' -exec dirname {} \; | head -n 1)"
            cd "$REPO_DIR"

            # 1. Capture current running application image for rollback protection
            PREV_IMAGE=$(sudo docker inspect --format='{{.Image}}' ecommerce-api-prod 2>/dev/null || echo "")
            echo "Previous working image for rollback protection: $PREV_IMAGE"

            # 2. Pull latest verified repository updates (force sync to main branch)
            git fetch origin main
            git reset --hard origin/main
            git pull origin main

            # 3. Pull or build verified application container
            IMAGE_REPO="${{ secrets.DOCKERHUB_USERNAME || 'abhishekdixitt18' }}/ecommerce-cloud-devops"
            TARGET_IMAGE="${IMAGE_REPO}:sha-${{ github.sha }}"
            
            if sudo docker pull "$TARGET_IMAGE" 2>/dev/null; then
              echo "Pulled pre-built image from registry: $TARGET_IMAGE"
              export APP_IMAGE="$TARGET_IMAGE"
            else
              echo "Building application container locally from multi-stage Dockerfile..."
              sudo docker compose -f docker-compose.prod.yml build app
              export APP_IMAGE="abhishekdixitt18/ecommerce-cloud-devops:latest"
            fi

            # 4. Synchronize compiled React frontend assets to volume & host
            echo "Synchronizing React frontend production assets..."
            sudo docker compose -f docker-compose.prod.yml run --rm frontend-sync || true
            sudo docker create --name temp-sync-assets "$APP_IMAGE" 2>/dev/null || true
            sudo docker cp temp-sync-assets:/usr/src/app/frontend/dist/. ./frontend/dist/ 2>/dev/null || true
            sudo docker rm -f temp-sync-assets 2>/dev/null || true

            # 5. Safely update application and reverse proxy (preserves postgres-prod-data volume)
            sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans app nginx

            # 6. Immediate internal health & frontend verification with retry loop
            echo "Performing local deployment health checks..."
            HEALTH_PASSED=false
            for i in {1..12}; do
              if curl -sf http://127.0.0.1/health > /dev/null && \
                 curl -sf http://127.0.0.1/health/ready > /dev/null && \
                 curl -s http://127.0.0.1/ | grep -q '<div id="root">'; then
                echo "Health & React Dashboard verification succeeded on attempt $i!"
                HEALTH_PASSED=true
                break
              fi
              echo "Waiting for services and frontend to become healthy (attempt $i/12)..."
              sleep 5
            done

            # 7. Automatic Rollback on failure
            if [ "$HEALTH_PASSED" != "true" ]; then
              echo "::error ::Deployment health verification failed! Triggering automatic rollback..."
              if [ -n "$PREV_IMAGE" ]; then
                echo "Restoring previous working container image ($PREV_IMAGE)..."
                sudo docker tag "$PREV_IMAGE" "${IMAGE_REPO}:rollback-active"
                export APP_IMAGE="${IMAGE_REPO}:rollback-active"
                sudo docker compose -f docker-compose.prod.yml up -d app
                sudo docker compose -f docker-compose.prod.yml restart nginx
              else
                echo "Reverting commit and rebuilding previous working release..."
                git checkout HEAD~1
                sudo docker compose -f docker-compose.prod.yml up -d --build app
                sudo docker compose -f docker-compose.prod.yml restart nginx
              fi
              echo "Rollback completed. Exiting with failure."
              exit 1
            fi

            echo "=== Continuous Deployment Successfully Completed ==="

  # =============================================================================
  # STAGE 10: POST-DEPLOYMENT VERIFICATION (FRONTEND + BACKEND)
  # =============================================================================
  stage-10-health-verification:
    name: 'Stage 10: Production Verification'
    needs: stage-9-ec2-deployment
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Live Production Services
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '54.252.184.109' }}
        run: |
          echo "=========================================="
          echo "Verifying Live Production Endpoints at http://${EC2_HOST}/"
          echo "=========================================="
          
          # Retry loop up to 60 seconds
          for i in {1..12}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "http://${EC2_HOST}/health" || echo "000")
            echo "Attempt $i: /health returned HTTP ${HTTP_STATUS}"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Backend health check passed!"
              break
            fi
            sleep 5
          done

          # Verify React Frontend Dashboard
          echo "Verifying React Frontend root (/)..."
          ROOT_HTML=$(curl -sL --connect-timeout 5 "http://${EC2_HOST}/" || echo "")
          if echo "$ROOT_HTML" | grep -q '<div id="root">'; then
            echo "SUCCESS: React Dashboard HTML verified (<div id=\"root\"> detected)."
          else
            echo "::error ::React root container not detected on http://${EC2_HOST}/! Failing verification."
            exit 1
          fi

          # Verify Database Readiness
          echo "Verifying Database Readiness (/health/ready)..."
          READY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "http://${EC2_HOST}/health/ready" || echo "000")
          echo "Readiness probe returned HTTP ${READY_STATUS}"

          # Verify Products API through Nginx reverse proxy
          echo "Verifying Products REST API (/api/v1/products)..."
          API_RES=$(curl -sL --connect-timeout 5 "http://${EC2_HOST}/api/v1/products" || echo "{}")
          if echo "$API_RES" | grep -q '"success":true'; then
            echo "SUCCESS: Products API responding through Nginx reverse proxy."
          else
            echo "::warning ::Products API response did not match expected structure."
          fi
