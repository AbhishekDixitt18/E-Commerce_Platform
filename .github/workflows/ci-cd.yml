name: CI/CD Pipeline - E-Commerce Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Minimal default permissions adhering to least privilege principle
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # STAGES 1-4: Code Quality & Automated Testing
  # =============================================================================
  quality-and-test:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Stage 2 - Install Dependencies from Lockfile
        run: npm ci

      - name: Stage 3 - Run Code Quality Static Analysis (ESLint)
        run: npm run lint

      - name: Initialize Isolated PostgreSQL Test Database
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce_test
          DB_USER: postgres
          DB_PASSWORD: postgres_ci_password
        run: |
          npm run db:init
          npm run db:seed

      - name: Stage 4 - Execute Automated Test Suite with Coverage
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce_test
          DB_USER: postgres
          DB_PASSWORD: postgres_ci_password
          ADMIN_API_KEY: algions-devops-admin-key-2026
        run: npm run test:coverage

  # =============================================================================
  # STAGES 5-8: Docker Build, Security Scan, Tagging & Docker Hub Publication
  # =============================================================================
  docker-build-scan-push:
    name: Docker Build, Security Scan & Publish
    needs: quality-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stage 7 - Generate Image Version Tags from Commit SHA
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || 'abhishekdixitt18' }}/ecommerce-cloud-devops
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch

      - name: Display Generated Version Tags
        run: |
          echo "Generated tags from commit SHA:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Stage 5 - Build Application Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ecommerce-api:${{ github.sha }}
          cache-from: type=gha

      - name: Stage 6 - Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ecommerce-api:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Check Docker Hub Credentials
        id: docker_secrets
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_TOKEN" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Docker Hub credentials are fully configured."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning ::Docker Hub secrets (DOCKERHUB_USERNAME and DOCKERHUB_TOKEN) are not configured in repository settings. Image push stage will be skipped until secrets are configured. Image building and Trivy vulnerability scanning completed successfully."
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.docker_secrets.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Stage 8 - Push Validated Image to Docker Hub
        if: github.event_name != 'pull_request' && steps.docker_secrets.outputs.configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
