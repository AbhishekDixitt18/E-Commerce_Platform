services:
  # =============================================================================
  # PostgreSQL Database Service (Internal Network Only - Zero Public Port Exposure)
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-ecommerce_prod}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password must be provided}
    expose:
      - "5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ecommerce_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce-backend-net

  # =============================================================================
  # Express REST API Backend Service
  # =============================================================================
  app:
    image: ${APP_IMAGE:-abhishekdixitt18/ecommerce-cloud-devops:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-api-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api/v1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecommerce_prod}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Database password must be provided}
      DB_SSL: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Admin API key must be provided}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.request({ host: '127.0.0.1', port: 3000, path: '/health', timeout: 3000 }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ecommerce-backend-net

  # =============================================================================
  # Nginx Reverse Proxy & TLS (Public Entrypoint: Port 80 & 443, Rate Limiting & SSL)
  # =============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: ecommerce-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/var/www/html:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ecommerce-backend-net

  # =============================================================================
  # Prometheus Observability Service (Metrics Collection & Scraping)
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ecommerce-prometheus-prod
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-prod-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ecommerce-backend-net

volumes:
  postgres-prod-data:
    driver: local
  prometheus-prod-data:
    driver: local

networks:
  ecommerce-backend-net:
    driver: bridge
